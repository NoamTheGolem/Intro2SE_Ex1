name: CI

# Every push and pull request: build with -Werror, run all unit tests, then run the demo
# command of the assignment on the course's own Ex0.csv and the lecturer's edge cases and check
# the video frame counts.
on:
  push:
  pull_request:

jobs:
  test:
    name: Build + tests (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build and run unit tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/test.sh

      - name: Build and run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\test.bat

      - name: Demo of the assignment (item 7) on the course CSV
        shell: bash
        run: |
          python Ex0.py data/phantom_spheres_u8.nrrd data/Ex0.csv ex0_demo.mp4 --threads auto
          python Ex0.py data/MRHead.nrrd data/planes_triangle.csv triangle.mp4 --interp trilinear
          python Ex0.py data/dice.nrrd data/course/edge_cases.csv edge_cases.mp4
          ls -l ex0_demo.mp4 triangle.mp4 edge_cases.mp4

      - name: Check frame counts with ffprobe (when available)
        shell: bash
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            n=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 ex0_demo.mp4)
            echo "Ex0.csv -> $n frames"; test "$n" = "4"
            n=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 triangle.mp4)
            echo "planes_triangle.csv -> $n frames"; test "$n" = "72"
            n=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 edge_cases.mp4)
            echo "the lecturer's edge_cases.csv -> $n frames"; test "$n" = "16"
          else
            echo "ffprobe not installed on this runner; frame-count check done by the JUnit demo test on Linux"
          fi

      - name: Invalid input must fail cleanly (exit code 2, no video)
        shell: bash
        run: |
          set +e
          python Ex0.py data/MRHead.nrrd data/Ex0.csv never.mp4 --strict
          code=$?
          set -e
          echo "exit code $code"; test "$code" = "2"; test ! -f never.mp4

      - name: Upload demo video
        if: runner.os == 'Linux' && matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: ex0-demo-video
          path: ex0_demo.mp4

  benchmark:
    name: FPS benchmark (500^3, informational)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: scripts/build.sh
      - name: Benchmark
        run: java -Xmx2g -cp build/Ex0.jar ex1.app.Benchmark 500 200 | tee benchmark.txt
      - name: Require >= 30 FPS single-threaded nearest (the assignment's hard limit)
        run: |
          fps=$(grep 'nearest   x1' benchmark.txt | awk '{print $4}')
          echo "single-thread nearest: $fps fps"
          awk -v f="$fps" 'BEGIN { exit (f >= 30) ? 0 : 1 }'
