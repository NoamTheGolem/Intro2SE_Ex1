subprojects {
    apply plugin: 'java'

    java {
        // Java 17 bytecode: runs on any JDK 17+ and is accepted by Android Gradle Plugin.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:all'
    }

    dependencies {
        // JUnit 4 jars are bundled in lib/ so the build works offline.
        testImplementation files(rootProject.file('lib/junit-4.13.2.jar'), rootProject.file('lib/hamcrest-core-1.3.jar'))
    }

    test {
        // Ex0Test reads data/MRHead.nrrd relative to the project folder.
        workingDir = rootProject.projectDir
        testLogging {
            events = ['failed', 'skipped']
            exceptionFormat = 'full'
        }
    }
}

project(':core') {
    apply plugin: 'java-library'
}

project(':app') {
    apply plugin: 'application'

    dependencies {
        implementation project(':core')
    }

    application {
        mainClass = 'ex1.app.Ex0'
    }

    // Single runnable jar: java -jar app/build/libs/Ex0.jar file.nrrd file.csv file.mp4
    jar {
        archiveFileName = 'Ex0.jar'
        manifest {
            attributes 'Main-Class': 'ex1.app.Ex0'
        }
        dependsOn ':core:jar'
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}
